<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Demo | Akhila Sunesh Portfolio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@400..900&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090e17;
      --primary: #a0006d;
      --accent: #4a8bdf;
      --text: #f0f4f8;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--bg-dark);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 1.5rem;
    }
    .video-player-container {
      width: 100%;
      max-width: 1100px;
      background: rgba(19, 29, 42, 0.85);
      border: 1px solid rgba(74, 139, 223, 0.3);
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 40px rgba(160, 0, 109, 0.2);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.6s ease-out;
    }
    .video-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      gap: 1rem;
    }
    .video-title-wrap h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff 30%, #4a8bdf 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .video-title-wrap p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: linear-gradient(135deg, var(--primary) 0%, #d81b80 100%);
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(160, 0, 109, 0.4);
    }
    .back-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(160, 0, 109, 0.6);
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    video {
      width: 100%;
      height: auto;
      max-height: 75vh;
      display: block;
      outline: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (max-width: 640px) {
      body { padding: 0.8rem; }
      .video-player-container { padding: 1rem; border-radius: 14px; }
      .video-title-wrap h1 { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <main class="video-player-container">
    <header class="video-header">
      <div class="video-title-wrap">
        <h1>Akhila Sunesh - Project Video Demonstration</h1>
        <p>Full demonstration walkthrough &amp; showcase</p>
      </div>
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
    </header>
    <div class="video-wrapper">
      <video controls autoplay playsinline preload="auto">
        <source src="docs/demo-video.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </main>
</body>
</html>
